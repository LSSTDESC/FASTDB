# FASTDB Local (Kind) Environment Values
# Usage: helm install fastdb ./helm/fastdb -f ./helm/fastdb/values-local.yaml

global:
  namespace: fastdb-local
  environment: local

  # Images built by docker-compose and loaded into Kind via kind load.
  # imagePullPolicy: Never means K8s uses the local store only — no registry contact.
  imageRegistry: "ghcr.io/lsstdesc"
  imageTag: "test20260428"
  imagePullPolicy: Never
  imagePullSecrets: []

utilityImages:
  busybox:
    pullPolicy: Never

# Use PVC for database storage, hostPath for code (via Kind extraMounts)
volumes:
  type: pvc  # PVCs for database storage
  storageClass: ""

  # Code is mounted via Kind extraMounts
  codeHostPath: true  # Enable hostPath for /fastdb-install and /fastdb-db

# Local development secrets (not for production!)
secrets:
  postgres:
    password: "fragile"
    roPassword: "readonly1234"
    replicatorPassword: "repl1c4t0r"
  secretKey: "fragilesecretkey"

  mongodb:
    adminUser: "admin"
    adminPassword: "fragile"
    readerUser: "alertreader"
    readerPassword: "reader"
    writerUser: "alertwriter"
    writerPassword: "writer"

# PostgreSQL
postgres:
  enabled: true
  persistence:
    size: 10Gi

  # NodePort for external access
  externalAccess:
    enabled: true
    type: NodePort
    nodePort: 30432

# Standby enabled for local testing
postgresStandby:
  enabled: true
  persistence:
    size: 10Gi

# MongoDB
mongodb:
  enabled: true
  persistence:
    size: 5Gi

# Web application with NodePort
webap:
  enabled: true
  externalAccess:
    enabled: true
    type: NodePort
    nodePort: 30080
  # Kind's local-path provisioner only supports ReadWriteOnce
  volumes:
    sessions:
      accessMode: ReadWriteOnce
    queryResults:
      accessMode: ReadWriteOnce
    logs:
      accessMode: ReadWriteOnce

# Shell pod for debugging
shell:
  enabled: true

# Query runner
queryrunner:
  enabled: true

# Mailhog with NodePort
mailhog:
  enabled: true
  image:
    pullPolicy: Never
  externalAccess:
    enabled: true
    type: NodePort
    nodePort: 30025

# Database migrations
createdb:
  enabled: true

# Consume Avro alerts produced by the local LASS Kafka container.  Kind reaches
# a Docker-published host port through host.docker.internal.
ingestion:
  enabled: true
  brokerConsumer:
    name: lass
    loggerName: LASS
    server: host.docker.internal:19092
    groupId: fastdb-local-lass
    topic: lass-topic
    schemaFile: /fastdb/share/avsc/lsst.v10_0.alert.avsc
    collectionBase: lass
    brokerName: lass
    # Docker Desktop's IPv4 gateway.  Pinning it avoids a non-routable IPv6
    # host.docker.internal record inside the Kind node.
    dockerHostIp: 192.168.65.254
    # LASS advertises localhost:19092.  This pod-local proxy forwards that
    # Kafka connection back to LASS on the Docker host.
    localhostProxy: true
  processingVersion:
    name: lass
  sourceImporter:
    schedule: "* * * * *"
