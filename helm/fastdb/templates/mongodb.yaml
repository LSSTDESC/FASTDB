{{- if .Values.mongodb.enabled }}
{{- $namespace := include "fastdb.namespace" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: {{ $namespace }}
  labels:
    {{- include "fastdb.labels" . | nindent 4 }}
    app: mongodb
spec:
  replicas: {{ .Values.mongodb.replicas }}
  strategy:
    type: {{ .Values.mongodb.updateStrategy.type }}
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      {{- include "fastdb.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: mongodb
        image: {{ include "fastdb.image" (dict "image" .Values.mongodb.image "global" .Values.global) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        envFrom:
        - configMapRef:
            name: mongodb-config
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        # Initialization uses a temporary localhost-only server. Wait for the
        # final server to listen on the pod IP before enabling health checks.
        # Allow up to ten minutes for initialization on a slow VM.
        startupProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: {{ $namespace }}-mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: {{ $namespace }}
  labels:
    {{- include "fastdb.labels" . | nindent 4 }}
    app: mongodb
spec:
  selector:
    app: mongodb
  ports:
  - name: mongodb
    port: 27017
    targetPort: 27017
  type: ClusterIP
{{- end }}
